<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#123b42;color:#18343a;font-family:system-ui,sans-serif;touch-action:none}button{font:inherit;cursor:pointer;border:0}#app{height:100dvh;display:flex;flex-direction:column;background:#123b42}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;color:#fff;background:#123b42;border-bottom:3px solid #0b2c32;z-index:2;gap:8px}.brand{font-weight:1000;letter-spacing:2px;font-size:17px}.brand small{display:block;font-size:8px;letter-spacing:3px;color:#a9dfc5}.stats{display:flex;gap:6px}.pill{background:#20535a;border:1px solid #4e8c80;border-radius:9px;padding:6px 8px;font-size:11px;font-weight:800;color:white}.pill b{color:#ffdb79}.iconbtn,.tab{background:#20535a;color:#fff;border:1px solid #57918a;border-radius:9px;padding:7px 9px;font-weight:900}#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#318c9a}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:absolute;top:9px;left:9px;display:grid;gap:5px;pointer-events:none}.hudbox{background:#fff1d8ed;border:2px solid #76583b;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:900;box-shadow:2px 2px #153b3d55}.bar{height:6px;width:100px;background:#d4c5a4;border-radius:8px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:#65bd78}.energy i{background:#f2b84f}.toast{position:absolute;left:50%;top:16%;transform:translate(-50%,-8px);background:#143f43;color:white;padding:9px 14px;border:2px solid #f3ce77;border-radius:9px;font-size:12px;font-weight:900;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:8px 9px calc(8px + env(safe-area-inset-bottom));background:#123b42;border-top:3px solid #0b2c32}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{font-size:10px;padding:8px}.tab.active{background:#f2c76b;color:#49391e;border-color:#ffe39a}.hint{font-size:9px;color:#b6d7c9}.modalwrap{position:absolute;inset:0;background:#071f25a8;display:none;align-items:center;justify-content:center;padding:13px;z-index:5}.modalwrap.open{display:flex}.modal{width:min(520px,100%);max-height:86%;overflow:auto;background:#fff8e8;border:3px solid #73563a;border-radius:14px;box-shadow:0 7px #102f38;padding:14px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.modal h2{margin:0;font-size:18px;color:#28534b}.close{background:#e8d8b7;border-radius:8px;padding:6px 10px;font-weight:900}.sub{font-size:11px;color:#6e705d;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.slot{background:#fffdf3;border:2px solid #e0d1ac;border-radius:8px;padding:8px 5px;text-align:center;font-size:11px}.slot strong{display:block;font-size:19px}.action{background:#286c61;color:white;border-radius:8px;padding:8px 10px;font-weight:900;font-size:11px;margin:3px}.action.gold{background:#e6b64e;color:#49351c}.action:disabled{opacity:.4}.rowline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #d7c8a5;padding:8px 0;font-size:11px;gap:6px}.quest{background:#fffdf4;border:1px solid #e1d2b2;border-radius:8px;padding:8px;margin:7px 0;font-size:11px}.quest b{color:#2d6455}.mobile{position:absolute;inset:auto 0 10px;display:none;justify-content:space-between;align-items:end;padding:0 13px;pointer-events:none}.stick,.acts{pointer-events:auto}.stick{width:112px;height:112px;border-radius:50%;background:#143e4770;border:2px solid #c4e2c777;position:relative;touch-action:none}.nub{position:absolute;width:40px;height:40px;left:34px;top:34px;border-radius:50%;background:#f2ca70dd;border:2px solid #fff0bd}.acts{display:grid;grid-template-columns:repeat(2,52px);gap:7px}.actbtn{width:52px;height:52px;border-radius:14px;background:#f2ca70e8;border:2px solid #fff0bd;color:#4 </style></head><body><div id="app">
<header class="top"><div class="brand">NOVA ISLAND<small>LIVE YOUR ISLAND STORY</small></div><div class="stats"><div class="pill">🪙 <b id="coins">25</b></div><div class="pill">📅 HARI <b id="day">1</b></div><button class="iconbtn" id="saveBtn">💾</button></div></header>
<main id="stage"><canvas id="game"></canvas><div class="hud"><div class="hudbox">❤️ KESEHATAN<div class="bar"><i id="healthbar" style="width:100%"></i></div></div><div class="hudbox">⚡ ENERGI <span id="energytext">100/100</span><div class="bar energy"><i id="energybar" style="width:100%"></i></div></div><div class="hudbox" id="clock">☀️ CERAH · 08:00</div></div><div class="toast" id="toast"></div>
<div class="mobile"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="acts"><button class="actbtn" id="interact">AKSI</button><button class="actbtn primary" id="gather">AMBIL</button><button class="actbtn" id="bag">TAS</button><button class="actbtn" id="mapquick">PETA</button></div></div>
<div class="modalwrap" id="modalwrap"><section class="modal"><div class="modalhead"><h2 id="modalTitle">Tas Petualang</h2><button class="close" id="closeModal">✕</button></div><div id="modalBody"></div></section></div></main>
<nav class="bottom"><div class="tabs"><button class="tab active" data-panel="inventory">🎒 Tas</button><button class="tab" data-panel="quests">📜 Misi</button><button class="tab" data-panel="craft">🛠 Craft</button><button class="tab" data-panel="build">🏡 Bangun</button><button class="tab" data-panel="map">🗺 Peta</button><button class="tab" data-panel="help">❔ Bantuan</button></div><div class="hint">WASD / panah · E interaksi · Space ambil</div></nav><div class="foot">NOVA ISLAND · PLAYABLE ALPHA 0.1 · SAVE LOKAL</div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),T=32,MW=52,MH=40;
let W=800,H=500,dpr=1,last=0,toastTimer=0,keys={},joy={x:0,y:0},stickDown=false;
const S={x:MW*T/2,y:MH*T/2,coins:25,energy:100,health:100,day:1,time:8,inv:{wood:0,stone:0,fruit:3,fiber:0,fish:0,seed:2,plank:0,berry:0},quests:{wood:0,fruit:0,fish:0,house:0},farm:[],xp:0,level:1};
const labels={wood:'Kayu',stone:'Batu',fruit:'Kelapa',fiber:'Serat',fish:'Ikan',seed:'Benih',plank:'Papan',berry:'Beri',bait:'Umpan'},emojis={wood:'🪵',stone:'🪨',fruit:'🥥',fiber:'🌿',fish:'🐟',seed:'🌱',plank:'🪚',berry:'🍓',bait:'🪱'};
const map=[],objs=[];function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
for(let y=0;y<MH;y++){map[y]=[];for(let x=0;x<MW;x++){let r=Math.hypot((x-MW/2)/MW,(y-MH/2)/MH);map[y][x]=r<.36?'g':r<.405?'s':'w';}}
for(let y=3;y<MH-3;y++)for(let x=3;x<MW-3;x++)if(map[y][x]==='g'&&hash(x,y)>.91){let r=hash(x+9,y+3);objs.push({x:x*T+16,y:y*T+16,type:r>.65?'tree':r>.35?'rock':'bush',active:true});}
objs.push({x:MW*T/2+65,y:MH*T/2+5,type:'home',active:true},{x:MW*T/2-100,y:MH*T/2+30,type:'npc',active:true},{x:MW*T/2+210,y:MH*T/2-180,type:'pond',active:true});
function resize(){let r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1900)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function terrain(x,y){return map[clamp(Math.floor(y/T),0,MH-1)]?.[clamp(Math.floor(x/T),0,MW-1)]||'w'}
function nearest(){let found=null,d0=58;for(let o of objs){if(!o.active)continue;let d=Math.hypot(o.x-S.x,o.y-S.y);if(d<d0){d0=d;found=o}}return found}
function tile(x,y,t){let px=x*T,py=y*T;if(t==='w'){ctx.fillStyle='#318a9b';ctx.fillRect(px,py,T,T);ctx.fillStyle='#55a9ae';ctx.fillRect(px+5+hash(x,y)*10,py+8,10,2);ctx.fillStyle='#267787';ctx.fillRect(px+18,py+23,9,2)}else if(t==='s'){ctx.fillStyle='#e9cf8c';ctx.fillRect(px,py,T,T);ctx.fillStyle='#d9b978';ctx.fillRect(px+5,py+7,2,2);ctx.fillRect(px+23,py+20,2,2)}else{ctx.fillStyle=hash(x,y)>.5?'#5da66b':'#58a064';ctx.fillRect(px,py,T,T);if(hash(x+3,y+4)>.72){ctx.fillStyle='#78bb73';ctx.fillRect(px+8,py+11,4,3)}}}
function object(o){let x=Math.round(o.x),y=Math.round(o.y);ctx.save();ctx.translate(x,y);if(o.type==='tree'){ctx.fillStyle='#815233';ctx.fillRect(-5,-2,10,23);ctx.fillStyle='#286e49';ctx.fillRect(-18,-24,36,23);ctx.fillStyle='#388b55';ctx.fillRect(-13,-31,26,18);ctx.fillStyle='#6dbb65';ctx.fillRect(-6,-28,7,6);ctx.fillStyle='#f3c95c';ctx.fillRect(8,-19,5,5)}else if(o.type==='rock'){ctx.fillStyle='#657c7a';ctx.fillRect(-13,-10,26,20);ctx.fillStyle='#9eae9c';ctx.fillRect(-8,-10,12,5)}else if(o.type==='camp'){ctx.fillStyle='#815233';ctx.fillRect(-15,7,30,5);ctx.fillRect(-11,1,22,5);ctx.fillStyle='#e58b38';ctx.fillRect(-7,-10,14,13);ctx.fillStyle='#ffd66b';ctx.fillRect(-3,-7,6,9);ctx.fillStyle='#f4c95c';ctx.fillRect(-2,-17,4,8)}else if(o.type==='bush'){ctx.fillStyle='#276e49';ctx.fillRect(-14,-9,28,18);ctx.fillStyle='#4caa5e';ctx.fillRect(-10,-15,20,13);ctx.fillStyle='#d94f56';ctx.fillRect(2,-7,5,5)}else if(o.type==='home'){ctx.fillStyle='#c28c54';ctx.fillRect(-25,-12,50,32);ctx.fillStyle='#8b4e3d';ctx.fillRect(-31,-20,62,13);ctx.fillStyle='#f0d49b';ctx.fillRect(-5,3,12,17);ctx.fillStyle='#76b8b2';ctx.fillRect(-19,-5,9,9)}else if(o.type==='npc'){ctx.fillStyle='#533b32';ctx.fillRect(-7,-19,14,8);ctx.fillStyle='#e7b184';ctx.fillRect(-7,-12,14,13);ctx.fillStyle='#4e91a0';ctx.fillRect(-9,1,18,15);ctx.fillStyle='#f1d6a4';ctx.fillRect(-4,-7,2,2);ctx.fillRect(3,-7,2,2)}else if(o.type==='pond'){ctx.fillStyle='#287d9b';ctx.fillRect(-28,-18,56,36);ctx.fillStyle='#7bc5c3';ctx.fillRect(-15,-10,18,3)}ctx.restore()}
function player(){let x=Math.round(S.x),y=Math.round(S.y);ctx.fillStyle='#183a3c55';ctx.fillRect(x-9,y+8,18,5);ctx.fillStyle='#e5ad7c';ctx.fillRect(x-7,y-14,14,13);ctx.fillStyle='#5a392c';ctx.fillRect(x-8,y-17,16,6);ctx.fillStyle='#253e4b';ctx.fillRect(x-8,y-2,16,13);ctx.fillStyle='#e5ad7c';ctx.fillRect(x-10,y,3,8);ctx.fillRect(x+7,y,3,8);ctx.fillStyle='#f2d16e';ctx.fillRect(x-7,y+11,5,5);ctx.fillRect(x+2,y+11,5,5);ctx.fillStyle='#263a3c';ctx.fillRect(x-3,y-9,2,2);ctx.fillRect(x+3,y-9,2,2)}
function render(){ctx.clearRect(0,0,W,H);let scale=Math.min(W/700,H/450,1.35),vw=W/scale,vh=H/scale,cx=clamp(S.x-vw/2,0,MW*T-vw),cy=clamp(S.y-vh/2,0,MH*T-vh);ctx.save();ctx.scale(scale,scale);ctx.translate(-cx,-cy);for(let y=Math.floor(cy/T);y<Math.ceil((cy+vh)/T);y++)for(let x=Math.floor(cx/T);x<Math.ceil((cx+vw)/T);x++)tile(x,y,map[y]?.[x]||'w');for(let o of objs)if(o.active)object(o);for(let f of S.farm){ctx.fillStyle='#805b38';ctx.fillRect(f.x-9,f.y-7,18,14);ctx.fillStyle=f.grown?'#55ad5c':'#75a84d';ctx.fillRect(f.x-3,f.y-17,6,12);if(f.grown){ctx.fillStyle='#f2c55e';ctx.fillRect(f.x+3,f.y-15,5,5)}}player();ctx.restore();let n=nearest();if(n){ctx.fillStyle='#fff4d6';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(n.type==='npc'?'E · BICARA':n.type==='pond'?'E · MEMANCING':n.type==='home'?'E · RUMAH':'E · INTERAKSI',W/2,H-145)}}
function update(dt){for(const farm of S.farm){if(farm.planted&&!farm.grown&&farm.plantedAt&&Date.now()-farm.plantedAt>=12000)farm.grown=true;}let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y,l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;let nx=S.x+dx*125*dt,ny=S.y+dy*125*dt;if(terrain(nx,ny)!=='w'){S.x=clamp(nx,30,MW*T-30);S.y=clamp(ny,30,MH*T-30)}}S.time+=dt*.16;if(S.time>=20){S.time=6;S.day++;S.energy=Math.min(100,S.energy+35);toast('Hari baru! Energi dipulihkan.')}if(S.energy<100)S.energy=Math.min(100,S.energy+dt*.28);document.getElementById('energytext').textContent=Math.floor(S.energy)+'/100';document.getElementById('energybar').style.width=S.energy+'%';document.getElementById('healthbar').style.width=S.health+'%';document.getElementById('coins').textContent=S.coins;document.getElementById('day').textContent=S.day;let h=Math.floor(S.time),m=Math.floor((S.time-h)*60);document.getElementById('clock').textContent=(h>=18||h<6?'🌙 MALAM':'☀️ CERAH')+' · '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function spend(n){if(S.energy<n){toast('Energi kurang! Istirahat dulu.');return false}S.energy-=n;return true}function sync(){document.getElementById('coins').textContent=S.coins;save(false)}
function fish(){if(!spend(5))return;let hasBait=(S.inv.bait||0)>0;if(hasBait)S.inv.bait--;let chance=hasBait?.9:.72;if(Math.random()<chance){S.inv.fish++;S.quests.fish++;toast(hasBait?'🎣 Umpan berhasil! Dapat 1 ikan.':'🎣 Dapat 1 ikan!')}else{S.inv.berry++;toast('🎣 Belum dapat ikan, menemukan beri.')}sync()}
function talk(){show('Pak Nara, Penjaga Pulau','<p>Halo, Penjelajah! Selamat datang di NOVA ISLAND. Kumpulkan bahan, buat peralatan, tanam benih, dan bangun pondokmu.</p><p><b>Hadiah selamat datang:</b></p><button class="action gold" id="gift">Ambil +5 koin</button>');document.getElementById('gift').onclick=()=>{S.coins+=5;S.xp+=5;toast('Pak Nara memberimu 5 koin!');close();sync()}}
function gather(){let o=nearest();if(!o){toast('Dekati pohon, batu, semak, atau kolam.');return}if(o.type==='tree'){if(!spend(5))return;S.inv.wood+=2;S.quests.wood+=2;o.active=false;toast('+2 Kayu')}else if(o.type==='rock'){if(!spend(8))return;S.inv.stone+=2;o.active=false;toast('+2 Batu')}else if(o.type==='bush'){if(!spend(3))return;S.inv.berry+=2;S.inv.fiber++;o.active=false;toast('+2 Beri, +1 Serat')}else if(o.type==='pond'){fish();return}else if(o.type==='npc'){talk();return}else if(o.type==='home'){open('build');return}sync()}
function interact(){let o=nearest();if(o){if(o.type==='npc')talk();else if(o.type==='pond')fish();else if(o.type==='home')open('build');else gather();return}let f=S.farm.find(z=>Math.hypot(z.x-S.x,z.y-S.y)<55);if(f){if(f.grown){S.inv.fruit+=2;S.quests.fruit+=2;S.farm=S.farm.filter(z=>z!==f);toast('Panen berhasil: +2 buah!')}else if(!f.planted){if(S.inv.seed<1){toast('Kamu butuh benih.');return}S.inv.seed--;f.planted=true;f.plantedAt=Date.now();toast('Benih ditanam. Siap panen dalam 12 detik.')}else toast('Tanaman masih tumbuh.');sync();return}toast('Tidak ada yang bisa diajak interaksi.')}
function show(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalwrap').classList.add('open')}function close(){document.getElementById('modalwrap').classList.remove('open')}
function recipe(title,id,emoji,cost,ok){return '<div class="rowline"><span>'+emoji+' <b>'+title+'</b><br><small>'+cost+'</small></span><button class="action" '+(ok?'':'disabled')+' onclick="craftItem(\''+id+'\')">Buat</button></div>'}
function open(which){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.panel===which));let title='',body='';if(which==='inventory'){title='🎒 Tas Petualang';body='<p class="sub">Barang yang kamu kumpulkan selama menjelajah.</p><div class="grid">'+Object.keys(labels).map(k=>'<div class="slot"><strong>'+emojis[k]+'</strong>'+labels[k]+'<br><b>'+(S.inv[k]||0)+'</b></div>').join('')+'</div><p class="sub">Koin: 🪙 '+S.coins+' · Level '+S.level+' · XP '+S.xp+'</p>'}else if(which==='quests'){title='📜 Misi Pulau';body='<p class="sub">Selesaikan misi untuk mendapat hadiah.</p>'+[['wood','Kumpulkan 10 kayu',10,20],['fruit','Kumpulkan 5 buah',5,15],['fish','Tangkap 3 ikan',3,25],['house','Bangun pondok pertama',1,50]].map(q=>'<div class="quest"><b>'+q[1]+'</b><div>Progress: '+Math.max(0,S.quests[q[0]])+'/'+q[2]+'</div><button class="action" '+(S.quests[q[0]]<q[2]?'disabled':'')+' onclick="claim(\''+q[0]+'\','+q[3]+')">'+(S.quests[q[0]]>=q[2]?'Klaim '+q[3]+' koin':'Belum selesai')+'</button></div>').join('')}else if(which==='craft'){title='🛠 Meja Crafting';body='<p class="sub">Ubah bahan mentah menjadi barang berguna.</p>'+recipe('Papan kayu ×2','plank','🪚','3 kayu → 2 papan',S.inv.wood>=3)+recipe('Paket benih','seed','🌱','2 beri',S.inv.berry>=2)+recipe('Umpan ikan','bait','🪱','2 serat',S.inv.fiber>=2)}else if(which==='build'){title='🏡 Bangun Pulau';body='<p class="sub">Bangunan ditempatkan di dekat karaktermu.</p><div class="rowline"><span>🏠 Pondok · 8 kayu + 5 batu</span><button class="action gold" '+(S.inv.wood<8||S.inv.stone<5?'disabled':'')+' onclick="buildHouse()">Bangun</button></div><div class="rowline"><span>🌾 Lahan · 3 kayu</span><button class="action" '+(S.inv.wood<3?'disabled':'')+' onclick="buildFarm()">Buat</button></div><div class="rowline"><span>🔥 Api unggun · 5 kayu + 2 batu</span><button class="action" '+(S.inv.wood<5||S.inv.stone<2?'disabled':'')+' onclick="buildCamp()">Bangun</button></div>'}else if(which==='map'){title='🗺 Peta Pulau';let homes=objs.filter(o=>o.active&&o.type==='home').length-1,camps=objs.filter(o=>o.active&&o.type==='camp').length;body='<p class="sub">Peta wilayah pulau dan bangunan yang benar-benar sudah kamu dirikan.</p><div style="background:#318a9b;border:5px solid #b9a16f;border-radius:12px;padding:12px;color:white;font-weight:900"><div style="display:flex;justify-content:space-between;font-size:10px"><span>UTARA · HUTAN 🌴</span><span>LAUT 🌊</span></div><div style="height:12px"></div><div style="background:#68a66d;border:2px solid #39734f;border-radius:9px;padding:13px;text-align:center"><div style="font-size:25px">🌳 🌲 🌿 🌳</div><div style="margin:8px auto;background:#e9cf8c;color:#59472c;border-radius:7px;padding:9px;font-size:12px">🏝️ DESA NOVA</div><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:12px"><span>🧍 POSISIMU</span><span>🏠 PONDOK: '+homes+'</span><span>🌾 LAHAN: '+S.farm.length+'</span><span>🔥 API: '+camps+'</span></div><div style="font-size:22px;margin-top:10px">🌴 🐟 🌊 🌴</div></div><div style="text-align:center;font-size:10px;margin-top:9px">SELATAN · PANTAI & KOLAM</div></div><p class="sub">Pondok yang dibangun juga muncul di area permainan. Tutup peta untuk melihatnya.</p>'}else{title='❔ Panduan';body='<div class="quest"><b>Kontrol</b><p>Joystick / WASD / panah untuk bergerak. E / AKSI untuk berinteraksi. Space / AMBIL untuk mengumpulkan.</p></div><div class="quest"><b>Aktivitas</b><p>Pohon memberi kayu, batu memberi batu, semak memberi beri dan serat. Kolam untuk memancing. Bicara dengan Pak Nara.</p></div><div class="quest"><b>Bertani</b><p>Buat lahan, dekati lahan lalu tekan AKSI untuk menanam benih. Panen setelah tumbuh.</p></div><div class="quest"><b>Simpan</b><p>Progress disimpan otomatis di browser perangkat ini. Tidak ada akun online atau cloud save pada alpha ini.</p></div>'}show(title,body)}
window.craftItem=function(id){if(id==='plank'&&S.inv.wood>=3){S.inv.wood-=3;S.inv.plank+=2}else if(id==='seed'&&S.inv.berry>=2){S.inv.berry-=2;S.inv.seed++}else if(id==='bait'&&S.inv.fiber>=2){S.inv.fiber-=2;S.inv.bait=(S.inv.bait||0)+2}else return;toast('Crafting berhasil!');open('craft');sync()};
window.claim=function(k,reward){let req={wood:10,fruit:5,fish:3,house:1};if(S.quests[k]<req[k]||S.quests[k]<0)return;S.quests[k]=-999;S.coins+=reward;S.xp+=reward;if(S.xp>=100*S.level){S.xp-=100*S.level;S.level++;toast('LEVEL UP! Level '+S.level)}else toast('Misi selesai! +'+reward+' koin');open('quests');sync()};
window.buildHouse=function(){if(S.inv.wood<8||S.inv.stone<5){toast('Butuh 8 kayu dan 5 batu untuk membangun pondok.');return}S.inv.wood-=8;S.inv.stone-=5;objs.push({type:'home',x:S.x+48,y:S.y+26,active:true});S.quests.house=1;toast('Pondok pertamamu selesai!');open('build');sync()};
window.buildFarm=function(){if(S.inv.wood<3)return;S.inv.wood-=3;S.farm.push({x:S.x+38,y:S.y+22,grown:false,planted:false});toast('Lahan dibuat. Dekati lalu tekan AKSI.');open('build');sync()};
window.buildCamp=function(){if(S.inv.wood<5||S.inv.stone<2){toast('Butuh 5 kayu dan 2 batu untuk membuat api unggun.');return}S.inv.wood-=5;S.inv.stone-=2;objs.push({type:'camp',x:S.x+45,y:S.y+28,active:true});toast('Api unggun berhasil dibangun!');open('build');sync()};
function save(showMsg){try{localStorage.setItem('novaIslandSave',JSON.stringify({version:2,state:S,objects:objs}));if(showMsg)toast('Progress dan bangunan berhasil disimpan!')}catch(e){if(showMsg)toast('Penyimpanan tidak tersedia.')}}function load(){try{let v=JSON.parse(localStorage.getItem('novaIslandSave'));if(v){if(v.version===2&&v.state){Object.assign(S,v.state);if(Array.isArray(v.objects)){objs.splice(0,objs.length,...v.objects)}}else{Object.assign(S,v)}for(const farm of S.farm){if(farm.planted&&!farm.plantedAt)farm.plantedAt=Date.now()-(farm.grown?12000:0)}toast('Save berhasil dimuat.')}}catch(e){toast('Data simpanan tidak terbaca. Mulai dengan data baru.')}}load();S.inv.bait=S.inv.bait||0;setInterval(()=>save(false),12000);
document.getElementById('saveBtn').onclick=()=>save(true);document.getElementById('closeModal').onclick=close;document.getElementById('modalwrap').onclick=e=>{if(e.target.id==='modalwrap')close()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>open(b.dataset.panel));document.getElementById('gather').onclick=gather;document.getElementById('interact').onclick=interact;document.getElementById('bag').onclick=()=>open('inventory');document.getElementById('mapquick').onclick=()=>open('map');
addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key==='e'||e.key==='E')interact();if(e.key===' ')gather();if(e.key==='Escape')close()});addEventListener('keyup',e=>keys[e.key]=false);
let stick=document.getElementById('stick'),nub=document.getElementById('nub');function setJoy(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),max=35;if(l>max){dx=dx/l*max;dy=dy/l*max}joy={x:dx/max,y:dy/max};nub.style.transform='translate('+dx+'px,'+dy+'px)'}function endJoy(){stickDown=false;joy={x:0,y:0};nub.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{stickDown=true;stick.setPointerCapture(e.pointerId);setJoy(e)});stick.addEventListener('pointermove',e=>{if(stickDown)setJoy(e)});stick.addEventListener('pointerup',endJoy);stick.addEventListener('pointercancel',endJoy);addEventListener('beforeunload',()=>save(false));
})();
</script></body></html>
