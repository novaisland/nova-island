(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),T=32,MW=52,MH=40;

const S={x:MW*T/2,y:MH*T/2,coins:25,energy:100,health:100,day:1,time:8,inv:{wood:0,stone:0,fruit:3,fiber:0,fish:0,seed:2,plank:0,berry:0},quests:{wood:0,fruit:0,fish:0,house:0},farm:[],xp:0,level:1};
const labels={wood:'Kayu',stone:'Batu',fruit:'Kelapa',fiber:'Serat',fish:'Ikan',seed:'Benih',plank:'Papan',berry:'Beri',bait:'Umpan'},emojis={wood:'🪵',stone:'🪨',fruit:'🥥',fiber:'🌿',fish:'🐟',seed:'🌱',plank:'🪚',berry:'🍓',bait:'🪱'};
const map=[],objs=[];function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
for(let y=0;y<MH;y++){map[y]=[];for(let x=0;x<MW;x++){let r=Math.hypot((x-MW/2)/MW,(y-MH/2)/MH);map[y][x]=r<.36?'g':r<.405?'s':'w';}}
for(let y=3;y<MH-3;y++)for(let x=3;x<MW-3;x++)if(map[y][x]==='g'&&hash(x,y)>.91){let r=hash(x+9,y+3);objs.push({x:x*T+16,y:y*T+16,type:r>.65?'tree':r>.35?'rock':'bush',active:true});}
objs.push({x:MW*T/2+65,y:MH*T/2+5,type:'home',active:true},{x:MW*T/2-100,y:MH*T/2+30,type:'npc',active:true},{x:MW*T/2+210,y:MH*T/2-180,type:'pond',active:true});
/* NOVA ISLAND — premium tropical ambient score, synthesized in Web Audio */
let audioCtx=null,musicTimer=null,musicStep=0,musicOn=true,sfxOn=true,masterGain=null,reverb=null,ambienceNode=null,ambienceGain=null,birdTimer=null;
try{const pref=JSON.parse(localStorage.getItem('novaAudioPrefs')||'{}');musicOn=pref.music!==false;sfxOn=pref.sfx!==false}catch(e){}
function persistAudio(){try{localStorage.setItem('novaAudioPrefs',JSON.stringify({music:musicOn,sfx:sfxOn}))}catch(e){}}
function initAudio(){
 if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();
  masterGain=audioCtx.createGain();masterGain.gain.value=.72;
  const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=.012;comp.release.value=.28;
  masterGain.connect(comp);comp.connect(audioCtx.destination);
  reverb=audioCtx.createConvolver();const len=Math.floor(audioCtx.sampleRate*2.1),buf=audioCtx.createBuffer(2,len,audioCtx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}
  reverb.buffer=buf;const wet=audioCtx.createGain();wet.gain.value=.19;reverb.connect(wet);wet.connect(comp);
 }
 if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
 if(musicOn)startMusic();
}
function voice(freq,duration,opts={}){
 if(!audioCtx||!masterGain)return;
 const t=audioCtx.currentTime+(opts.delay||0),o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
 o.type=opts.type||'sine';o.frequency.setValueAtTime(freq,t);if(opts.slide)o.frequency.exponentialRampToValueAtTime(Math.max(35,freq+opts.slide),t+duration);
 if(opts.detune)o.detune.value=opts.detune;
 f.type='lowpass';f.frequency.value=opts.cutoff||4200;f.Q.value=.55;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(opts.volume||.018,t+(opts.attack||.04));g.gain.exponentialRampToValueAtTime(.0001,t+duration);
 o.connect(f);f.connect(g);g.connect(masterGain);if(reverb&&opts.wet!==false)g.connect(reverb);
 const pan=audioCtx.createStereoPanner?audioCtx.createStereoPanner():null;if(pan){g.disconnect();g.connect(pan);pan.pan.value=opts.pan||0;pan.connect(masterGain);if(reverb&&opts.wet!==false)pan.connect(reverb)}
 o.start(t);o.stop(t+duration+.06);
}
function noiseBurst(duration,volume,cutoff,delay=0){
 if(!audioCtx)return;const n=Math.floor(audioCtx.sampleRate*duration),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;s.buffer=b;f.type='lowpass';f.frequency.value=cutoff;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);s.connect(f);f.connect(g);g.connect(masterGain);s.start(t);s.stop(t+duration+.02);
}
function pluck(freq,delay=0,volume=.027){voice(freq,.62,{type:'triangle',volume,attack:.009,cutoff:5200,delay,pan:Math.sin(musicStep*.7)*.22})}
const scale=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99],melody=[0,2,4,2,1,4,5,4,0,2,4,6,5,4,2,1,0,2,5,4,2,1,3,2,0,4,5,7,5,4,2,1];
const chords=[[146.83,185,220],[110,138.59,164.81],[123.47,146.83,185],[98,123.47,146.83]];
function padChord(chord,delay=0){
 chord.forEach((hz,i)=>{voice(hz,2.55,{type:'sine',volume:.008,attack:.65,cutoff:1050,delay,pan:(i-1)*.28});voice(hz*2,2.15,{type:'triangle',volume:.0028,attack:.55,cutoff:1800,delay,pan:(i-1)*.2})});
}
function musicTick(){
 if(!audioCtx||!musicOn)return;const step=musicStep%32,bar=Math.floor(step/8),ch=chords[Math.floor(step/8)%4];
 if(step%8===0){padChord(ch);voice(ch[0]/2,1.35,{type:'sine',volume:.022,attack:.09,cutoff:500});}
 if(step%2===0){const idx=melody[step],note=scale[idx];pluck(note,0,.021);if(step%8===4)pluck(scale[(idx+2)%8]*2,.035,.009)}
 if(step%4===0)voice(ch[0]/2,.48,{type:'triangle',volume:.013,attack:.025,cutoff:360});
 if(step%8===2||step%8===6)noiseBurst(.055,.009,2400);
 if(step%8===0)voice(78,.16,{type:'sine',volume:.014,attack:.012,cutoff:180,slide:-34});
 musicStep++;
}
function startMusic(){
 if(!audioCtx||!musicOn||musicTimer)return;
 musicTick();musicTimer=setInterval(musicTick,300);
 if(!ambienceNode){
  const n=Math.floor(audioCtx.sampleRate*3),b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  ambienceNode=audioCtx.createBufferSource();ambienceNode.buffer=b;ambienceNode.loop=true;
  const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=430;const g=audioCtx.createGain();g.gain.value=.009;
  ambienceNode.connect(f);f.connect(g);g.connect(masterGain);ambienceNode.start();ambienceGain=g;
 }
 if(!birdTimer)birdTimer=setInterval(()=>{if(!musicOn||!audioCtx)return;const base=[1174.66,1396.91,1567.98,1760][Math.floor(Math.random()*4)];voice(base,.12,{type:'sine',volume:.006,attack:.018,slide:base*.12,delay:.02,pan:Math.random()*.9-.45});voice(base*1.25,.16,{type:'sine',volume:.004,attack:.025,slide:-base*.08,delay:.19,pan:Math.random()*.9-.45})},11000+Math.random()*4000);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(birdTimer){clearInterval(birdTimer);birdTimer=null}if(ambienceNode){try{ambienceNode.stop()}catch(e){}ambienceNode=null;ambienceGain=null}}
function playSfx(kind='click'){
 if(!sfxOn||!audioCtx)return;
 const seq={
 click:()=>voice(740,.07,{type:'sine',volume:.018,attack:.006,cutoff:3000}),
 gather:()=>{voice(310,.12,{type:'triangle',volume:.035,slide:180,cutoff:1800});voice(620,.16,{type:'sine',volume:.018,delay:.065})},
 fish:()=>{voice(420,.18,{type:'sine',volume:.025,slide:180});voice(680,.24,{type:'triangle',volume:.02,delay:.12});noiseBurst(.12,.018,3200,.04)},

 harvest:()=>[523.25,659.25,783.99,1046.5].forEach((n,i)=>voice(n,.38,{type:'sine',volume:.023,delay:i*.085,attack:.015,pan:(i-1.5)*.16})),

 build:()=>{[293.66,369.99,440,587.33].forEach((n,i)=>voice(n,.48,{type:'triangle',volume:.022,delay:i*.12,attack:.025}));noiseBurst(.2,.02,500,.3)},
 reward:()=>[523.25,659.25,783.99,1046.5,1318.5].forEach((n,i)=>voice(n,.42,{type:'sine',volume:.025,delay:i*.09,attack:.012,pan:(i-2)*.12})),

function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function terrain(x,y){return map[clamp(Math.floor(y/T),0,MH-1)]?.[clamp(Math.floor(x/T),0,MW-1)]||'w'}
function nearest(){let found=null,d0=58;for(let o of objs){if(!o.active)continue;let d=Math.hypot(o.x-S.x,o.y-S.y);if(d<d0){d0=d;found=o}}return found}
function tile(x,y,t){let px=x*T,py=y*T;if(t==='w'){ctx.fillStyle='#318a9b';ctx.fillRect(px,py,T,T);ctx.fillStyle='#55a9ae';ctx.fillRect(px+5+hash(x,y)*10,py+8,10,2);ctx.fillStyle='#267787';ctx.fillRect(px+18,py+23,9,2)}else if(t==='s'){ctx.fillStyle='#e9cf8c';ctx.fillRect(px,py,T,T);ctx.fillStyle='#d9b978';ctx.fillRect(px+5,py+7,2,2);ctx.fillRect(px+23,py+20,2,2)}else{ctx.fillStyle=hash(x,y)>.5?'#5da66b':'#58a064';ctx.fillRect(px,py,T,T);if(hash(x+3,y+4)>.72){ctx.fillStyle='#78bb73';ctx.fillRect(px+8,py+11,4,3)}}}

 const body=unavailable?'<p class="sub">Menu akun berhasil dibuka, tetapi pustaka koneksi Supabase belum termuat. Periksa koneksi internet lalu muat ulang game.</p>':

 '<p class="sub">Buat akun atau masuk untuk menyimpan progress NOVA ISLAND di cloud.</p><form id="novaAuthForm"><label class="sub">Email</label><input id="novaEmail" type="email" required autocomplete="email" placeholder="email@contoh.com" style="width:100%;padding:11px;margin:5px 0 10px;border:2px solid #d7c8a5;border-radius:8px"><label class="sub">Password (minimal 6 karakter)</label><input id="novaPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="Password akun" style="width:100%;padding:11px;margin:5px 0 10px;border:2px solid #d7c8a5;border-radius:8px"><button class="action" type="submit">Masuk</button><button class="action gold" type="button" id="signUp">Daftar akun</button></form><p id="authMessage" class="sub">Gunakan email milikmu. Password diproses oleh Supabase.</p>';
 window.__NOVA.show('👤 Akun NOVA ISLAND',body);
 if(unavailable||!user){if(!unavailable){const form=document.getElementById('novaAuthForm'),msg=document.getElementById('authMessage');const creds=()=>({email:document.getElementById('novaEmail').value.trim(),password:document.getElementById('novaPassword').value});form.onsubmit=async e=>{e.preventDefault();msg.textContent='Sedang masuk...';const {error}=await client.auth.signInWithPassword(creds());msg.textContent=error?error.message:'Login berhasil.'};document.getElementById('signUp').onclick=async()=>{const v=creds();if(!v.email||v.password.length<6){msg.textContent='Isi email dan password minimal 6 karakter.';return}msg.textContent='Mendaftarkan akun...';const {data,error}=await client.auth.signUp({email:v.email,password:v.password,options:{emailRedirectTo:window.location.origin+'/nova-island/'}});msg.textContent=error?error.message:(data.session?'Akun dibuat dan berhasil login.':'Akun dibuat. Periksa email untuk konfirmasi, lalu masuk.')}}return}
 document.getElementById('syncNow').onclick=pushSave;document.getElementById('signOut').onclick=async()=>{const {error}=await client.auth.signOut();if(error)alert(error.message)}
}
const accountButton=document.getElementById('accountBtn');
if(accountButton)accountButton.addEventListener('click',renderAccount);
window.NOVACloud={queueSave,pushSave,showAccount:renderAccount};
try{if(window.supabase&&window.supabase.createClient){client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);client.auth.onAuthStateChange((_event,next)=>{setTimeout(()=>acceptSession(next),0)});client.auth.getSession().then(({data,error})=>{if(error)console.warn(error);acceptSession(data?.session||null)}).catch(e=>console.warn('NOVA auth init:',e))}else console.warn('Supabase JS library did not load; account menu remains available.')}catch(e){console.error('NOVA Supabase initialization failed:',e)}
})();
</script></body></html>
